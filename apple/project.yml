# XcodeGen spec for the iPhone relay + watch app. Generate with `make apple-project`.
# Signing team and bundle-ID prefix come from Config/Local.xcconfig (not committed; see SETUP.md).
name: CPRCoach
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0" # Series 5 can't go past watchOS 10
  createIntermediateGroups: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "4"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: CPR Coach
    INFOPLIST_KEY_NSHealthShareUsageDescription: Reads your heart rate during CPR practice.
    INFOPLIST_KEY_NSHealthUpdateUsageDescription: Saves your CPR practice as a workout.

targetTemplates:
  RelayApp:
    type: application
    platform: iOS
    sources:
      - Sources/iOS
      - Sources/Core
      - Sources/Shared
      - path: Resources
        buildPhase: resources
    entitlements:
      path: Config/CPRCoach.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Config/CPRCoach-Info.plist
      properties:
        # Hackathon only: lets plain ws:// reach the laptop's raw IP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).cprcoach
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # Phone coach works propped up in either orientation.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Connects to the CPR Coach laptop on your local network.
        INFOPLIST_KEY_NSCameraUsageDescription: Watches your arm position from the side to coach elbows and shoulders. Video never leaves the phone.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Listens for hands-free voice commands like "swap" or "how am I doing" while your hands are on the chest.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Understands your voice commands on the phone, so you can keep both hands on the chest.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES

targets:
  CPRCoach:
    templates: [RelayApp]
    dependencies:
      - target: CPRCoachWidgets
        embed: true
      - target: CPRCoachWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch

  # Same iPhone relay without the embedded watch app. Lets the phone ↔ laptop link be tested
  # before the watch is registered to the signing team (make apple-install-phone).
  CPRCoachPhoneOnly:
    templates: [RelayApp]
    dependencies:
      - target: CPRCoachWidgets
        embed: true

  # Lock-screen / Dynamic Island Live Activity for a running session.
  CPRCoachWidgets:
    type: app-extension
    platform: iOS
    sources: [Sources/Widgets, Sources/Shared]
    info:
      path: Config/CPRCoachWidgets-Info.plist
      properties:
        CFBundleDisplayName: CPR Coach
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).cprcoach.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES

  CPRCoachWatch:
    type: application
    platform: watchOS
    sources: [Sources/Watch, Sources/Core]
    entitlements:
      path: Config/CPRCoachWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    info:
      path: Config/CPRCoachWatch-Info.plist
      properties:
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).cprcoach
        WKBackgroundModes: [workout-processing]
    settings:
      base:
        PRODUCT_NAME: CPRCoach Watch
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).cprcoach.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_KEY_NSMotionUsageDescription: Measures chest compression rate and depth from wrist motion.
        # Keep the bundle installable on watchOS 10 (Series 5): no debug/preview helper dylibs,
        # and only the arm64_32 slice (Xcode's arm64 slice requires watchOS 26). Every current
        # watch runs arm64_32.
        ENABLE_DEBUG_DYLIB: NO
        ENABLE_PREVIEWS: NO
        ARCHS: arm64_32
        ONLY_ACTIVE_ARCH: NO

schemes:
  CPRCoach:
    build:
      targets:
        CPRCoach: all
        CPRCoachWatch: all
    run:
      config: Debug
  CPRCoachPhoneOnly:
    build:
      targets:
        CPRCoachPhoneOnly: all
    run:
      config: Debug
  CPRCoachWatch:
    build:
      targets:
        CPRCoachWatch: all
    run:
      config: Debug
